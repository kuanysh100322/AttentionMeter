<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attention Meter Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>Attention Meter – Switches per Day</h2>

<canvas id="chart" width="600" height="300"></canvas>

<script>
    fetch("http://localhost:8080/api/days")
        .then(res => res.json())
        .then(data => {

            const labels = data.map(d => d.date);
            const values = data.map(d => d.switches);

            const ctx = document.getElementById('chart').getContext('2d');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Switches per Day',
                        data: values,
                        borderWidth: 2
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

        })
        .catch(err => {
            document.body.innerHTML += "<p style='color:red'>Error loading data</p>";
            console.error(err);
        });
</script>

</body>
</html>
